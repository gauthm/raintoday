<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>RainToday — Radar Pluie</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="css/style.css?v=6" />
</head>
<body>
  <!-- Map container -->
  <div id="map"></div>

  <!-- Top overlay: search -->
  <div id="search-container">
    <input type="text" id="search-input" class="glass-overlay" placeholder="" aria-label="" autocomplete="off" />
    <div id="search-results" class="glass-overlay"></div>
  </div>

  <!-- Top right: geolocation button -->
  <button id="geoloc-btn" class="glass-overlay" title="" aria-label="">📍</button>

  <!-- Right overlay: color legend (below geoloc button) -->
  <div id="legend" class="glass-overlay">
    <div class="legend-title">mm/h</div>
    <div class="legend-bar">
      <div style="background:#1a3a5a" title="0"></div>
      <div style="background:#2a7aba" title="0.5"></div>
      <div style="background:#2a9ada" title="2"></div>
      <div style="background:#3abada" title="5"></div>
      <div style="background:#6affda" title="10"></div>
      <div style="background:#ffea00" title="20"></div>
      <div style="background:#ff8800" title="40"></div>
      <div style="background:#ff3333" title="60+"></div>
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast" class="glass-overlay"></div>

  <!-- Bottom panel: graph + slider + controls -->
  <div id="bottom-panel">

    <!-- Graphique + slider dans le même wrapper pour aligner les largeurs -->
    <div id="timeline-wrapper">

      <!-- Barres de précipitation -->
      <canvas id="graph-canvas"></canvas>

      <!-- Slider : fill et handle ENFANTS de slider-track -->
      <div id="slider-track">
        <div id="slider-fill"></div>
        <div id="slider-handle"></div>
      </div>

      <!-- Ticks temporels -->
      <div id="slider-ticks"></div>

    </div>

    <!-- Ligne infos + contrôles -->
    <div id="time-info">
      <span id="precip-info"></span>
      <span id="current-time">--:--</span>
      <div id="controls">
        <button id="play-btn"></button>
        <button id="now-btn" title=""></button>
      </div>
    </div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
